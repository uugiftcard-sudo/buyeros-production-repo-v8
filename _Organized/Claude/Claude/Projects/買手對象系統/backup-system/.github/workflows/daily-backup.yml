name: Daily Supabase DB Backup

# 每日 HK 01:00 自動 pg_dump → upload 去 Cloudflare R2
# 失敗會 Telegram alert
# 可以手動 trigger (workflow_dispatch)

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = HK 01:00
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups
          pg_dump \
            -h db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co \
            -p 5432 \
            -U postgres \
            -d postgres \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            -f backups/buyeros-${DATE}.sql

          # Sanity check：dump 要有最少 10KB 至算 OK
          SIZE=$(stat -c%s backups/buyeros-${DATE}.sql)
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Dump file too small ($SIZE bytes) — possible failure"
            exit 1
          fi

          gzip backups/buyeros-${DATE}.sql
          ls -lh backups/

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          aws s3 cp \
            backups/buyeros-${DATE}.sql.gz \
            s3://${{ secrets.R2_BUCKET }}/supabase-db/buyeros-${DATE}.sql.gz \
            --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: Cleanup R2 old backups (keep 30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%d)
          aws s3 ls s3://${{ secrets.R2_BUCKET }}/supabase-db/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} | \
          while read -r line; do
            FILE=$(echo "$line" | awk '{print $4}')
            FILE_DATE=$(echo "$FILE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ -n "$FILE_DATE" ] && [[ "$FILE_DATE" < "$CUTOFF" ]]; then
              echo "Deleting old backup: $FILE"
              aws s3 rm s3://${{ secrets.R2_BUCKET }}/supabase-db/$FILE \
                --endpoint-url ${{ secrets.R2_ENDPOINT }}
            fi
          done

      - name: Telegram alert on success
        if: success()
        run: |
          DATE=$(date +%Y-%m-%d)
          SIZE=$(ls -lh backups/buyeros-${DATE}.sql.gz | awk '{print $5}')
          MSG=$(printf "✅ BuyerOS DB backup OK\nDate: %s\nSize: %s" "$DATE" "$SIZE")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_TG_ID }}" \
            --data-urlencode "text=${MSG}"

      - name: Telegram alert on failure
        if: failure()
        run: |
          MSG=$(printf "🚨 BuyerOS DB backup FAILED\nDate: %s\nRun: https://github.com/%s/actions/runs/%s" "$(date)" "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_TG_ID }}" \
            --data-urlencode "text=${MSG}"
