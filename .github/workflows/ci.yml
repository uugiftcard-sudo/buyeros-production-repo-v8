name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q --tb=short

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --output-format=github

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install mypy
      - run: mypy app --ignore-missing-imports --follow-untyped-imports

  # ── Docker build (no registry push in CI — deploy pipeline handles that) ──
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend

  # ── Docker smoke (start stack, wait for healthy, stop) ──────────────────
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, backend-typecheck, docker-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --detach
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/ping 2>/dev/null)
            echo "Attempt $i: backend /ping → $status"
            [ "$status" = "200" ] && echo "Backend is up!" && exit 0
            sleep 2
          done
          echo "Backend did not become healthy within 60s"
          docker compose logs backend
          exit 1
      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null)
            echo "Attempt $i: frontend / → $status"
            [ "$status" = "200" ] && echo "Frontend is up!" && exit 0
            sleep 2
          done
          echo "Frontend did not become healthy within 60s"
          docker compose logs frontend
          exit 1
      - name: Smoke API health
        run: |
          curl -sf http://localhost:8000/ping && echo " /ping OK"
          curl -sf http://localhost:8000/health/ready && echo " /health/ready OK"
      - run: docker compose down --volumes

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run ui:smoke
