name: Automation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-check:
    name: Team Automation Check (${{ github.ref == 'refs/heads/main' && 'live' || 'dry-run' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Clone the team/automation controller into a temp location so the
      # workflow is self-contained even without the ~/Documents mount.
      # On a self-hosted runner the real ~/Documents path is available and
      # TEAM_AUTOMATION_DIR can be set to skip this step.
      - name: Locate automation controller
        id: locate
        run: |
          if [ -n "$TEAM_AUTOMATION_DIR" ] && [ -d "$TEAM_AUTOMATION_DIR" ]; then
            echo "dir=$TEAM_AUTOMATION_DIR" >> "$GITHUB_OUTPUT"
            echo "Using real automation dir: $TEAM_AUTOMATION_DIR"
          else
            echo "dir=${{ github.workspace }}/team-automation" >> "$GITHUB_OUTPUT"
            echo "No TEAM_AUTOMATION_DIR — will use workspace copy (dry-run only)"
          fi

      # Dry-run: validate config can be loaded and all commands are parseable
      # without executing anything. Runs on both PRs and main push.
      - name: Dry-run check (all repos)
        if: github.ref != 'refs/heads/main' || env.TEAM_AUTOMATION_DIR == ''
        working-directory: ${{ github.workspace }}
        run: |
          # If the automation dir isn't available (hosted runner), emit a
          # clear advisory and exit 0 — this job is informational on
          # standard GitHub runners.
          if [ ! -f "${{ steps.locate.outputs.dir }}/run.py" ]; then
            echo "::notice::automation-check requires a self-hosted runner with TEAM_AUTOMATION_DIR set."
            echo "::notice::Dry-run skipped on standard GitHub runner (no local repo paths available)."
            exit 0
          fi
          python3 "${{ steps.locate.outputs.dir }}/run.py" check \
            --repo all \
            --dry-run

      # Full check: only on push to main, requires self-hosted runner with
      # the real TEAM_AUTOMATION_DIR env var pointing at ~/Documents/team/automation.
      - name: Full check (all repos)
        if: github.ref == 'refs/heads/main' && env.TEAM_AUTOMATION_DIR != ''
        working-directory: ${{ github.workspace }}
        run: |
          python3 "$TEAM_AUTOMATION_DIR/run.py" check --repo all

      - name: HTTP smoke — BuyerOS
        if: github.ref == 'refs/heads/main' && env.TEAM_AUTOMATION_DIR != ''
        run: |
          python3 "$TEAM_AUTOMATION_DIR/smoke_http.py" buyeros \
            --base-url "${TEAM_AUTOMATION_BUYEROS_URL:-http://127.0.0.1:3000}" \
            --timeout 10

      - name: HTTP smoke — XAU
        if: github.ref == 'refs/heads/main' && env.TEAM_AUTOMATION_DIR != ''
        run: |
          python3 "$TEAM_AUTOMATION_DIR/smoke_http.py" xau \
            --base-url "${TEAM_AUTOMATION_XAU_URL:-http://127.0.0.1:3002}" \
            --timeout 10

      - name: HTTP smoke — CLOTH
        if: github.ref == 'refs/heads/main' && env.TEAM_AUTOMATION_DIR != ''
        run: |
          python3 "$TEAM_AUTOMATION_DIR/smoke_http.py" cloth \
            --base-url "${TEAM_AUTOMATION_CLOTH_URL:-http://127.0.0.1:3001}" \
            --timeout 10
